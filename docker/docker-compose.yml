version: '3.8'

services:
  ecm-api-app:
    container_name: ecm-api-app
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    extra_hosts:
      - "bt-server:100.64.0.15"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-ecm_db}
      - DB_USERNAME=${DB_USERNAME:-ecm_user}
      - DB_PASSWORD=${DB_PASSWORD:-ecm_secret}
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local
