[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-testgen"
version = "0.1.0"
description = "CLI tool to scan Laravel routes and generate API test case collections."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cursor AI" }]
dependencies = []

[project.scripts]
rag-testgen = "rag_testgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
